
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Push-up Coach</title>

<style>
:root {
  color-scheme: light dark;
  font-family: system-ui, sans-serif;
}

body {
  margin: 0;
  padding: 12px;
  max-width: 560px;
  margin: auto;
}

.card {
  border: 1px solid #8884;
  border-radius: 12px;
  padding: 12px;
  margin: 10px 0;
}

h2 {
  margin: 0 0 8px;
  font-size: 1rem;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: .9rem;
}

td, th {
  padding: 4px;
  text-align: right;
  border-bottom: 1px solid #8883;
}

td:first-child, th:first-child {
  text-align: left;
}

button {
  padding: 10px 14px;
  border-radius: 8px;
  border: 0;
  background: #2563eb;
  color: #fff;
  font-size: 1rem;
  margin: 4px 4px 4px 0;
}

button.alt {
  background: #6b7280;
}

input {
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #8886;
  width: 9em;
}

.bar {
  height: 8px;
  background: #8883;
  border-radius: 4px;
  overflow: hidden;
}

#prog {
  height: 100%;
  width: 0;
  background: #2563eb;
}

.ok, .bad {
  padding: 10px;
  border-radius: 8px;
  margin: 4px 0;
  font-weight: 600;
}

.ok {
  background: #16a34a33;
}

.bad {
  background: #dc262633;
}

#reps {
  font-size: 2.4rem;
  font-weight: 700;
}

#log {
  font-size: .85rem;
  max-height: 140px;
  overflow: auto;
}

#status {
  font-size: .9rem;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="card">
  <h2>Connection</h2>
  <button onclick="connect()">Connect ESP32</button>
  <span id="status">Not connected</span>
</div>

<div class="card">
  <h2>Live sensors (°)</h2>

  <table>
    <thead>
      <tr>
        <th>Sensor</th>
        <th>Sagittal</th>
        <th>Lateral</th>
      </tr>
    </thead>
    <tbody id="sens"></tbody>
  </table>

  <p>Chest height: <b id="dist">–</b> mm</p>

  <table>
    <thead>
      <tr>
        <th>Derived</th>
        <th>Left</th>
        <th>Right</th>
      </tr>
    </thead>
    <tbody id="der"></tbody>
  </table>
</div>

<div class="card">
  <h2>Calibration (15 s)</h2>

  <input id="pname" placeholder="Profile name" value="me">

  <button onclick="startCal()">Start calibration</button>

  <div id="calMsg">
    Phases: push-up motion → arms wide → elbows tucked (5 s each)
  </div>

  <div class="bar">
    <div id="prog"></div>
  </div>
</div>

<div class="card">
  <h2>Training</h2>

  <button id="tbtn" onclick="toggleTrain()">Start training</button>
  <button class="alt" onclick="resetReps()">Reset</button>

  <div id="reps">0</div>
  <div id="fb"></div>
  <div id="log"></div>
</div>

<script>

// ---------- Bluetooth UUIDs ----------

const SVC = '12345678-1234-1234-1234-1234567890ab';
const CHR = '12345678-1234-1234-1234-1234567890ac';

const $ = id => document.getElementById(id);

const wrap = a => {
  while(a > 180) a -= 360;
  while(a < -180) a += 360;
  return a;
};

const clamp01 = x => Math.max(0, Math.min(1, x));

const mean = (a, f) =>
  a.reduce((s, x) => s + f(x), 0) / a.length;

const NAMES = [
  'L upper arm',
  'L wrist',
  'R upper arm',
  'R wrist'
];

const SIDES = {
  L: {u:0, w:1, n:'Left'},
  R: {u:2, w:3, n:'Right'}
};

let S = [{},{},{},{}];
let dist = 0;
let prof = null;
let mode = 'idle';
let cal = null;

let bleDevice = null;
let bleCharacteristic = null;


// ---------- UI skeleton ----------

$('sens').innerHTML = NAMES.map((n,i) =>
  `<tr>
    <td>${n}</td>
    <td id="s${i}a">–</td>
    <td id="s${i}b">–</td>
  </tr>`
).join('');

$('der').innerHTML = ['elbow','flare','wrist'].map(k =>
  `<tr>
    <td>${{
      elbow:'Elbow angle',
      flare:'Arm flare dev.',
      wrist:'Wrist dev.'
    }[k]}</td>
    <td id="L${k}">–</td>
    <td id="R${k}">–</td>
  </tr>`
).join('');

// Load saved calibration

try {
  prof = JSON.parse(localStorage.getItem('pushupProfile'));

  if(prof) {
    $('calMsg').textContent =
      'Saved profile loaded: ' + prof.name;
  }
} catch(e) {
  console.error('Profile loading error:', e);
}


// ---------- Bluetooth connection ----------

async function connect() {

  try {

    if(!navigator.bluetooth) {
      throw new Error(
        'Web Bluetooth unavailable. Open this HTTPS page in Chrome.'
      );
    }

    $('status').textContent = 'Searching for ESP32...';

    // Show all nearby BLE devices

    bleDevice = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [SVC]
    });

    console.log('Selected device:', bleDevice.name);

    $('status').textContent =
      'Selected: ' + (bleDevice.name || 'Unknown device');

    bleDevice.addEventListener(
      'gattserverdisconnected',
      () => {
        $('status').textContent = 'Disconnected';
        bleCharacteristic = null;
      }
    );

    $('status').textContent = 'Connecting...';

    const server = await bleDevice.gatt.connect();

    $('status').textContent = 'Finding BLE service...';

    const service = await server.getPrimaryService(SVC);

    $('status').textContent =
      'Finding sensor characteristic...';

    bleCharacteristic =
      await service.getCharacteristic(CHR);

    await bleCharacteristic.startNotifications();

    bleCharacteristic.addEventListener(
      'characteristicvaluechanged',
      event => onData(event.target.value)
    );

    $('status').textContent =
      'Connected to ' + (bleDevice.name || 'ESP32');

    console.log('BLE connection successful');

  } catch(error) {

    console.error('BLE Error:', error);

    $('status').textContent =
      'Error: ' + error.message;
  }
}


// ---------- Receive sensor data ----------

function onData(dv) {

  // Four sensors, 4 bytes each

  for(let i = 0; i < 4; i++) {

    S[i] = {
      sag: dv.getInt16(i * 4, true) / 100,
      lat: dv.getInt16(i * 4 + 2, true) / 100
    };
  }

  // Distance in millimeters

  dist = dv.getUint16(16, true);

  const m = derive();

  render(m);

  if(mode === 'cal') {
    calStep(m);
  }
  else if(mode === 'train' && prof) {
    train(m);
  }
}


// ---------- Derive angles ----------

function derive() {

  const m = {};

  for(const k in SIDES) {

    const {u,w} = SIDES[k];

    m[k] = {
      elbow: 180 - Math.abs(
        wrap(S[u].sag - S[w].sag)
      ),

      lu: S[u].lat,
      lw: S[w].lat
    };

    if(prof) {

      m[k].flare = Math.abs(
        wrap(S[u].lat - prof[k].tuckU)
      );

      m[k].wrist = Math.abs(
        wrap(S[w].lat - prof[k].tuckW)
      );
    }
  }

  return m;
}


// ---------- Render sensor data ----------

function render(m) {

  S.forEach((s,i) => {

    $(`s${i}a`).textContent = s.sag.toFixed(1);
    $(`s${i}b`).textContent = s.lat.toFixed(1);

  });

  $('dist').textContent = dist;

  for(const k in SIDES) {

    for(const f of ['elbow','flare','wrist']) {

      $(k + f).textContent =
        m[k][f] === undefined
          ? '–'
          : m[k][f].toFixed(0);

    }
  }
}


// ---------- Calibration ----------

const PH = [
  '1/3 Push-up motion: go down and up slowly',
  '2/3 Open both arms wide sideways',
  '3/3 Tuck elbows in, push-up position, hold'
];

function startCal() {

  if(!bleCharacteristic) {
    alert('Connect ESP32 first!');
    return;
  }

  cal = {
    t0: performance.now(),
    a: {L:[], R:[]},
    d: [],
    o: {L:[], R:[]},
    t: {L:[], R:[]}
  };

  mode = 'cal';
}

function calStep(m) {

  const t = (performance.now() - cal.t0) / 1000;

  const ph = Math.min(2, Math.floor(t / 5));

  $('calMsg').textContent =
    PH[ph] + ' (' + Math.max(0, Math.ceil(15-t)) + 's)';

  $('prog').style.width =
    Math.min(100, t / 15 * 100) + '%';

  for(const k in SIDES) {

    if(ph === 0) {
      cal.a[k].push(m[k].elbow);
    }
    else if(ph === 1) {
      cal.o[k].push([m[k].lu, m[k].lw]);
    }
    else {
      cal.t[k].push([m[k].lu, m[k].lw]);
    }
  }

  if(ph === 0) {
    cal.d.push(dist);
  }

  if(t >= 15) {
    finishCal();
  }
}

function finishCal() {

  mode = 'idle';

  const p = {
    name: $('pname').value || 'me',
    dMin: Math.min(...cal.d),
    dMax: Math.max(...cal.d)
  };

  p.dr = p.dMax - p.dMin;

  for(const k in SIDES) {

    const e = cal.a[k];

    const q = {
      eBot: Math.min(...e),
      eTop: Math.max(...e)
    };

    q.tuckU = mean(cal.t[k], x => x[0]);
    q.tuckW = mean(cal.t[k], x => x[1]);

    q.openU = mean(cal.o[k], x => x[0]);
    q.openW = mean(cal.o[k], x => x[1]);

    q.flareMax = Math.max(
      8,
      Math.abs(wrap(q.openU - q.tuckU)) * 0.5
    );

    q.wristMax = Math.max(
      8,
      Math.abs(wrap(q.openW - q.tuckW)) * 0.5
    );

    p[k] = q;

    if(q.eTop - q.eBot < 25) {

      $('calMsg').textContent =
        SIDES[k].n +
        ' arm: not enough movement in phase 1 – redo calibration';

      return;
    }
  }

  prof = p;

  localStorage.setItem(
    'pushupProfile',
    JSON.stringify(p)
  );

  $('calMsg').textContent =
    'Calibration done for ' + p.name + ' ✓';

  $('prog').style.width = '100%';
}


// ---------- Training / form check ----------

let rep = {
  n:0,
  state:'top',
  min:1,
  prev:1,
  iss:new Set()
};

let cnt = {};

const chk = (key,c) => {

  cnt[key] = c ? (cnt[key] || 0) + 1 : 0;

  return cnt[key] >= 5;
};

const log = s => {

  $('log').innerHTML =
    `<div>${s}</div>` + $('log').innerHTML;
};


function toggleTrain() {

  if(mode === 'train') {

    mode = 'idle';

    $('tbtn').textContent = 'Start training';

    return;
  }

  if(!bleCharacteristic) {
    alert('Connect ESP32 first');
    return;
  }

  if(!prof) {
    alert('Calibrate first');
    return;
  }

  mode = 'train';

  $('tbtn').textContent = 'Stop training';
}


function resetReps() {

  rep = {
    n:0,
    state:'top',
    min:1,
    prev:1,
    iss:new Set()
  };

  cnt = {};

  $('reps').textContent = 0;
  $('log').innerHTML = '';
  $('fb').innerHTML = '';
}


function train(m) {

  const pe = ['L','R'].map(k =>

    clamp01(
      (m[k].elbow - prof[k].eBot) /
      (prof[k].eTop - prof[k].eBot)
    )

  );

  let p = (pe[0] + pe[1]) / 2;

  if(prof.dr > 30) {

    p = (
      p + clamp01((dist - prof.dMin) / prof.dr)
    ) / 2;
  }

  const descending = p < rep.prev;

  const issues = [];

  for(const k in SIDES) {

    const n = SIDES[k].n;

    if(chk(k+'f', m[k].flare > prof[k].flareMax)) {

      issues.push(
        `${n} elbow flaring out – tuck it in`
      );
    }

    if(chk(k+'w', m[k].wrist > prof[k].wristMax)) {

      issues.push(
        `${n} wrist twisting – keep hand straight`
      );
    }
  }

  if(
    p < 0.9 &&
    chk('sym', Math.abs(pe[0] - pe[1]) > 0.25)
  ) {

    const lag =
      (descending === (pe[0] > pe[1]))
        ? 'Left'
        : 'Right';

    issues.push(
      `${lag} arm is lagging – move both arms evenly`
    );
  }

  $('fb').innerHTML = issues.length
    ? issues.map(i => `<div class="bad">${i}</div>`).join('')
    : '<div class="ok">Form OK</div>';


  if(rep.state === 'top' && p < 0.7) {

    rep.state = 'down';
    rep.min = p;
    rep.iss = new Set();
  }

  if(rep.state === 'down') {

    rep.min = Math.min(rep.min, p);

    issues.forEach(i => rep.iss.add(i));

    if(p > 0.85) {

      rep.state = 'top';

      if(rep.min < 0.25) {

        rep.n++;

        $('reps').textContent = rep.n;

        log(
          `Rep ${rep.n}: ` +
          (
            rep.iss.size
              ? [...rep.iss].join('; ')
              : '✓ good form'
          )
        );

      } else {

        log('Half rep – go lower (not counted)');
      }
    }
  }

  rep.prev = p;
}

</script>

</body>
</html>
