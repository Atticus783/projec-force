<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sensor test</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}
body{margin:0;padding:12px;max-width:560px;margin:auto}
.card{border:1px solid #8884;border-radius:12px;padding:12px;margin:10px 0}
h2{margin:0 0 8px;font-size:1rem}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{padding:6px;text-align:right;border-bottom:1px solid #8883}
td:first-child,th:first-child{text-align:left}
button{padding:12px 16px;border-radius:8px;border:0;background:#2563eb;color:#fff;font-size:1rem}
.ok{color:#16a34a;font-weight:700}.bad{color:#dc2626;font-weight:700}
</style></head><body>

<div class="card"><h2>Connection</h2>
<button onclick="connect()">Connect ESP32</button> <span id="status">Not connected</span>
<p>Packets per second: <b id="hz">0</b> (should be about 20)</p></div>

<div class="card"><h2>Sensors</h2>
<table><thead><tr><th>Sensor</th><th>Sagittal °</th><th>Lateral °</th><th>Status</th></tr></thead>
<tbody id="sens"></tbody></table>
<p style="font-size:.85rem">"NO DATA" = the sensor returned nothing (exactly 180 / 180). Check its wiring and power.</p></div>

<div class="card"><h2>Elbow and chest</h2>
<table>
<tr><th></th><th>Left</th><th>Right</th></tr>
<tr><td>Elbow angle (°)</td><td id="eL">–</td><td id="eR">–</td></tr>
</table>
<p>Chest distance: <b id="dist">–</b> <span id="dstat"></span></p></div>

<script>
const SVC='12345678-1234-1234-1234-1234567890ab', CHR='12345678-1234-1234-1234-1234567890ac';
const $=id=>document.getElementById(id);
const wrap=a=>{while(a>180)a-=360;while(a<-180)a+=360;return a};
const NAMES=['L upper arm (ch 2)','L wrist (ch 3)','R upper arm (ch 4)','R wrist (ch 5)'];
$('sens').innerHTML=NAMES.map((n,i)=>`<tr><td>${n}</td><td id="s${i}">–</td><td id="l${i}">–</td><td id="t${i}">–</td></tr>`).join('');
let count=0;
setInterval(()=>{$('hz').textContent=count;count=0},1000);

async function connect(){
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}]});
    dev.addEventListener('gattserverdisconnected',()=>$('status').textContent='Disconnected');
    const srv=await dev.gatt.connect();
    const ch=await (await srv.getPrimaryService(SVC)).getCharacteristic(CHR);
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged',e=>onData(e.target.value));
    $('status').textContent='Connected ✓';
  }catch(e){$('status').textContent='Error: '+e.message}
}

function onData(dv){
  count++;
  const sag=[],lat=[];
  for(let i=0;i<4;i++){
    sag[i]=dv.getInt16(i*4,true)/100;lat[i]=dv.getInt16(i*4+2,true)/100;
    $('s'+i).textContent=sag[i].toFixed(1);$('l'+i).textContent=lat[i].toFixed(1);
    const dead=Math.abs(sag[i])>=179.9&&Math.abs(lat[i])>=179.9;
    $('t'+i).textContent=dead?'NO DATA':'OK';$('t'+i).className=dead?'bad':'ok';
  }
  $('eL').textContent=(180-Math.abs(wrap(sag[0]-sag[1]))).toFixed(0);
  $('eR').textContent=(180-Math.abs(wrap(sag[2]-sag[3]))).toFixed(0);
  const d=dv.getUint16(16,true);
  $('dist').textContent=d+' mm';
  $('dstat').textContent=d===0?'(no echo yet)':'';
}
</script></body></html>
